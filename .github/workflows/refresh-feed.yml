# Re-scrapes Meetup, Eventbrite and Luma and commits events.json to the
# `data` branch, which the app reads from raw.githubusercontent.com.
name: Refresh feed
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh-feed
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check out the data branch
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch -q --depth 1 origin data
            git worktree add data origin/data
          else
            git worktree add --detach data
            git -C data checkout -q --orphan data-new
            git -C data rm -rfq .
          fi
      - run: dart run tool/aggregate.dart data/events.json
      - name: Commit if changed
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -qm "Refresh feed: $(python3 -c 'import json;print(len(json.load(open("events.json"))["events"]))') events"
          git push -q origin HEAD:refs/heads/data
